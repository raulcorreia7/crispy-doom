name: Crispy Doom Release

on:
  push:
    tags:
      - 'crispy-doom-v*'
  workflow_dispatch:

env:
  DMCP_DIR: third_party/doom-mcp
  DMCP_BUILD_DIR: build/dmcp

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: crispy-doom-linux
            asset_name: crispy-doom-linux.tar.gz
          - os: macos-latest
            platform: macos
            artifact_name: crispy-doom-macos
            asset_name: crispy-doom-macos.tar.gz
          - os: windows-latest
            platform: windows
            artifact_name: crispy-doom-windows
            asset_name: crispy-doom-windows.zip

    steps:
      - name: Checkout crispy-doom
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup MSVC (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        shell: bash
        run: scripts/dmcp-release/install_deps.sh --platform "${{ matrix.platform }}"

      - name: Build DMCP and Crispy Doom
        shell: bash
        run: >
          scripts/dmcp-release/build.sh
          --platform "${{ matrix.platform }}"
          --dmcp-dir "${{ env.DMCP_DIR }}"
          --dmcp-build-dir "${{ env.DMCP_BUILD_DIR }}"

      - name: Package and verify
        shell: bash
        run: >
          scripts/dmcp-release/package.sh
          --platform "${{ matrix.platform }}"
          --artifact-name "${{ matrix.artifact_name }}"
          --asset-name "${{ matrix.asset_name }}"
          --release-tag "${{ github.ref_name }}"
          --dmcp-dir "${{ env.DMCP_DIR }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/crispy-doom-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          scripts/dmcp-release/publish_release.sh
          --tag "${{ github.ref_name }}"
          --artifacts-dir dist
          --title "Crispy Doom ${{ github.ref_name }}"
